name: Build Dotnet DNP3 Image 
permissions:
  contents: read
on:
 workflow_dispatch:
  inputs:
   COMPONENT:
    type: choice
    description: 'Select the component'
    required: true
    options: 
    - Master
    - Outstation
   VERSION:
    description: 'Provide the version'
    required: true
    default: 'latest'
env: 
 JFROG_REGISTRY_URL: artifactory.nationalgrid.com
 JFROG_LOCAL_REPO: derms-odb
 DOCKER_REGISTRY_URL: docker.io
jobs:
 docker-build:
   runs-on:
     group: aks-runners
   steps:
   - name: Checkout Code
     uses: actions/checkout@v4 
   - name: Container Registry Login
     run: |
      docker login -u ${{ secrets.JFROG_ARTIFACTORY_USER }} -p ${{ secrets.JFROG_ARTIFACTORY_PASSWORD }} ${{ env.JFROG_REGISTRY_URL }}  
   - name: Convert component name to lowercase
     id: lowercase
     run: echo "component=${{ inputs.COMPONENT }}" | tr '[:upper:]' '[:lower:]' >>${GITHUB_ENV}
   - name: Docker Build
     run: |        
      cd dnp3-dotnet/Simulator.Dnp3
      docker build -f ${{ inputs.COMPONENT }}/Dockerfile -t ${component}:${{ inputs.VERSION }} .   
   - name: Re-Tag Images
     run: |
      echo "Test"
      docker tag ${component}:${{ inputs.VERSION }} ${{ env.JFROG_REGISTRY_URL }}/${{ env.JFROG_LOCAL_REPO }}/dnp3/${component}:${{ inputs.VERSION }}
   - name: Push Images to JFrog Registry
     run: |   
      echo "Test"
      docker push ${{ env.JFROG_REGISTRY_URL }}/${{ env.JFROG_LOCAL_REPO }}/dnp3/${component}:${{ inputs.VERSION }}

