# ips.yaml
# ------------
# This file contains a list of IP addresses to be assigned to simulated DNP3 outstations.
# IMPORTANT: The server must already be configured with these IP addresses.
# If the IPs are not configured on the host machine, the outstations will fail to bind.


# -------------------------------
# How to configure IP addresses:
# -------------------------------

# Temporary IP (until reboot):
# Run this command in the terminal:
#   sudo ip addr add 192.168.1.101/24 dev eth0
# Replace `eth0` with your actual network interface (use `ip link` to list interfaces).

# Permanent IP (survives reboot):
# Edit the Netplan config (Ubuntu 18.04+):
#   sudo nano /etc/netplan/01-netcfg.yaml
# Example:
#   network:
#     version: 2
#     ethernets:
#       eth0:
#         addresses:
#           - 192.168.1.101/24
#         gateway4: 192.168.1.1
#         nameservers:
#           addresses: [192.168.1.1, 8.8.8.8]
# Then apply changes:
#   sudo netplan apply

ips:
- 
